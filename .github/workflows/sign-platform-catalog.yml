name: Sign NEZU platform catalog

on:
  push:
    branches: [main]
    paths:
      - assets/catalog.json
      - assets/platforms/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    if: github.actor != 'github-actions[bot]'
    env:
      NEZU_RELEASE_PRIVATE_KEY_HEX: ${{ secrets.NEZU_RELEASE_PRIVATE_KEY_HEX }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install cryptography==42.0.8
      - name: Explain signing setup
        if: env.NEZU_RELEASE_PRIVATE_KEY_HEX == ''
        run: echo 'Catalog not signed: configure NEZU_RELEASE_PRIVATE_KEY_HEX in repository secrets.'
      - name: Sign the catalog
        id: sign_catalog
        if: env.NEZU_RELEASE_PRIVATE_KEY_HEX != ''
        run: python tools/sign_catalog.py --catalog assets/catalog.json --signature assets/catalog.json.sig
      - name: Commit detached signature
        if: steps.sign_catalog.outcome == 'success'
        run: |
          if git diff --quiet -- assets/catalog.json.sig; then exit 0; fi
          git config user.name 'nezu-release-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/catalog.json.sig
          git commit -m 'chore(assets): sign platform catalog'
          git push
